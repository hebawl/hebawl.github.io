<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-flyrank" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0ede8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8e5e0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="400" height="300" fill="url(#grad-flyrank)"/>
  
  <!-- Cluster centers -->
  <g>
    <!-- Cluster 1 - Top Left (Green) -->
    <circle cx="120" cy="80" r="45" fill="#315c52" opacity="0.1" stroke="#315c52" stroke-width="1"/>
    <circle cx="120" cy="80" r="3" fill="#315c52"/>
    
    <!-- Cluster 2 - Top Right (Blue) -->
    <circle cx="280" cy="90" r="50" fill="#1565c0" opacity="0.1" stroke="#1565c0" stroke-width="1"/>
    <circle cx="280" cy="90" r="3" fill="#1565c0"/>
    
    <!-- Cluster 3 - Bottom Left (Orange) -->
    <circle cx="90" cy="200" r="48" fill="#e65100" opacity="0.1" stroke="#e65100" stroke-width="1"/>
    <circle cx="90" cy="200" r="3" fill="#e65100"/>
    
    <!-- Cluster 4 - Bottom Right (Purple) -->
    <circle cx="310" cy="190" r="42" fill="#6a1b9a" opacity="0.1" stroke="#6a1b9a" stroke-width="1"/>
    <circle cx="310" cy="190" r="3" fill="#6a1b9a"/>
  </g>
  
  <!-- Data points for each cluster -->
  <!-- Cluster 1 -->
  <circle cx="105" cy="65" r="2.5" fill="#315c52" opacity="0.7"/>
  <circle cx="130" cy="75" r="2.5" fill="#315c52" opacity="0.7"/>
  <circle cx="115" cy="95" r="2.5" fill="#315c52" opacity="0.7"/>
  <circle cx="145" cy="85" r="2.5" fill="#315c52" opacity="0.7"/>
  
  <!-- Cluster 2 -->
  <circle cx="265" cy="75" r="2.5" fill="#1565c0" opacity="0.7"/>
  <circle cx="295" cy="80" r="2.5" fill="#1565c0" opacity="0.7"/>
  <circle cx="280" cy="110" r="2.5" fill="#1565c0" opacity="0.7"/>
  <circle cx="310" cy="95" r="2.5" fill="#1565c0" opacity="0.7"/>
  <circle cx="275" cy="105" r="2.5" fill="#1565c0" opacity="0.7"/>
  
  <!-- Cluster 3 -->
  <circle cx="75" cy="185" r="2.5" fill="#e65100" opacity="0.7"/>
  <circle cx="105" cy="210" r="2.5" fill="#e65100" opacity="0.7"/>
  <circle cx="95" cy="220" r="2.5" fill="#e65100" opacity="0.7"/>
  <circle cx="110" cy="195" r="2.5" fill="#e65100" opacity="0.7"/>
  
  <!-- Cluster 4 -->
  <circle cx="295" cy="170" r="2.5" fill="#6a1b9a" opacity="0.7"/>
  <circle cx="320" cy="195" r="2.5" fill="#6a1b9a" opacity="0.7"/>
  <circle cx="310" cy="210" r="2.5" fill="#6a1b9a" opacity="0.7"/>
  <circle cx="335" cy="185" r="2.5" fill="#6a1b9a" opacity="0.7"/>
  
  <!-- Legend -->
  <g font-family="DM Mono, monospace" font-size="9" fill="#555">
    <text x="60" y="255">Cluster 1</text>
    <text x="150" y="255">Cluster 2</text>
    <text x="240" y="255">Cluster 3</text>
    <text x="320" y="255">Cluster 4</text>
  </g>
  
  <!-- Title -->
  <text x="200" y="270" font-family="Inter, sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#171717">
    K-Means Page Performance Clustering
  </text>
  <text x="200" y="288" font-family="DM Mono, monospace" font-size="11" text-anchor="middle" fill="#777">
    4 Archetypes · 30K+ Pages · Silhouette Analysis
  </text>
</svg>
