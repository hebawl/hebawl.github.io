<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-flyrank-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f3f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ede9e4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="400" height="300" fill="url(#grad-flyrank-bg)"/>
  
  <!-- Header section with title concept -->
  <g>
    <!-- Header bar -->
    <rect x="0" y="0" width="400" height="80" fill="#7a1f35" opacity="0.05"/>
    
    <!-- Title text representation -->
    <text x="200" y="35" font-family="Fraunces, serif" font-size="18" font-weight="500" text-anchor="middle" fill="#111111">
      Which pages
    </text>
    <text x="200" y="58" font-family="Fraunces, serif" font-size="18" font-weight="500" text-anchor="middle" fill="#111111">
      to fix first?
    </text>
  </g>
  
  <!-- Four archetypes visualization -->
  <g>
    <!-- Box backgrounds representing the 4 archetypes -->
    <rect x="30" y="100" width="80" height="70" fill="#e8f5e9" stroke="#7a1f35" stroke-width="1.5" rx="4"/>
    <rect x="130" y="100" width="80" height="70" fill="#fce4ec" stroke="#7a1f35" stroke-width="1.5" rx="4"/>
    <rect x="230" y="100" width="80" height="70" fill="#e3f2fd" stroke="#7a1f35" stroke-width="1.5" rx="4"/>
    <rect x="330" y="100" width="80" height="70" fill="#f3e5f5" stroke="#7a1f35" stroke-width="1.5" rx="4"/>
    
    <!-- Labels for archetypes -->
    <text x="70" y="138" font-family="Inter, sans-serif" font-size="12" font-weight="500" text-anchor="middle" fill="#111111">
      Archetype
    </text>
    <text x="70" y="153" font-family="Inter, sans-serif" font-size="11" text-anchor="middle" fill="#555">
      1
    </text>
    
    <text x="170" y="138" font-family="Inter, sans-serif" font-size="12" font-weight="500" text-anchor="middle" fill="#111111">
      Archetype
    </text>
    <text x="170" y="153" font-family="Inter, sans-serif" font-size="11" text-anchor="middle" fill="#555">
      2
    </text>
    
    <text x="270" y="138" font-family="Inter, sans-serif" font-size="12" font-weight="500" text-anchor="middle" fill="#111111">
      Archetype
    </text>
    <text x="270" y="153" font-family="Inter, sans-serif" font-size="11" text-anchor="middle" fill="#555">
      3
    </text>
    
    <text x="370" y="138" font-family="Inter, sans-serif" font-size="12" font-weight="500" text-anchor="middle" fill="#111111">
      Archetype
    </text>
    <text x="370" y="153" font-family="Inter, sans-serif" font-size="11" text-anchor="middle" fill="#555">
      4
    </text>
  </g>
  
  <!-- Data metrics -->
  <g font-family="Inter, sans-serif">
    <circle cx="70" cy="200" r="35" fill="#f1eeea"/>
    <text x="70" y="195" font-size="18" font-weight="600" text-anchor="middle" fill="#7a1f35">30K+</text>
    <text x="70" y="215" font-size="10" text-anchor="middle" fill="#5a5a5a">Pages</text>
    
    <circle cx="170" cy="200" r="35" fill="#f1eeea"/>
    <text x="170" y="195" font-size="18" font-weight="600" text-anchor="middle" fill="#7a1f35">32</text>
    <text x="170" y="215" font-size="10" text-anchor="middle" fill="#5a5a5a">Clients</text>
    
    <circle cx="270" cy="200" r="35" fill="#f1eeea"/>
    <text x="270" y="195" font-size="18" font-weight="600" text-anchor="middle" fill="#7a1f35">4</text>
    <text x="270" y="215" font-size="10" text-anchor="middle" fill="#5a5a5a">Archetypes</text>
    
    <circle cx="370" cy="200" r="35" fill="#f1eeea"/>
    <text x="370" y="200" font-size="10" font-weight="500" text-anchor="middle" fill="#7a1f35">K-Means</text>
    <text x="370" y="213" font-size="9" text-anchor="middle" fill="#5a5a5a">Clustering</text>
  </g>
  
  <!-- Bottom section -->
  <g>
    <text x="200" y="265" font-family="Fraunces, serif" font-size="13" font-weight="500" text-anchor="middle" fill="#111111">
      Content Archetype Clustering
    </text>
    <text x="200" y="285" font-family="Inter, sans-serif" font-size="10" text-anchor="middle" fill="#5a5a5a">
      Machine Learning · Data Analysis · FlyRank Internship
    </text>
  </g>
</svg>
