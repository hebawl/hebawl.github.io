<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0ede8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8e5e0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="400" height="300" fill="url(#grad3)"/>
  
  <!-- Axes -->
  <line x1="60" y1="220" x2="360" y2="220" stroke="#315c52" stroke-width="2"/>
  <line x1="60" y1="220" x2="60" y2="40" stroke="#315c52" stroke-width="2"/>
  
  <!-- Grid lines -->
  <g stroke="#d8d7d1" stroke-width="0.5" opacity="0.4" stroke-dasharray="3,2">
    <line x1="60" y1="60" x2="360" y2="60"/>
    <line x1="60" y1="100" x2="360" y2="100"/>
    <line x1="60" y1="140" x2="360" y2="140"/>
    <line x1="60" y1="180" x2="360" y2="180"/>
    <line x1="120" y1="220" x2="120" y2="40"/>
    <line x1="180" y1="220" x2="180" y2="40"/>
    <line x1="240" y1="220" x2="240" y2="40"/>
    <line x1="300" y1="220" x2="300" y2="40"/>
  </g>
  
  <!-- Regression line -->
  <line x1="70" y1="180" x2="350" y2="70" stroke="#315c52" stroke-width="2.5" opacity="0.7"/>
  
  <!-- Data points -->
  <circle cx="85" cy="175" r="3.5" fill="#315c52" opacity="0.6"/>
  <circle cx="110" cy="160" r="3.5" fill="#315c52" opacity="0.6"/>
  <circle cx="145" cy="145" r="3.5" fill="#315c52" opacity="0.6"/>
  <circle cx="175" cy="130" r="3.5" fill="#315c52" opacity="0.6"/>
  <circle cx="205" cy="115" r="3.5" fill="#315c52" opacity="0.6"/>
  <circle cx="240" cy="100" r="3.5" fill="#315c52" opacity="0.6"/>
  <circle cx="275" cy="85" r="3.5" fill="#315c52" opacity="0.6"/>
  <circle cx="310" cy="70" r="3.5" fill="#315c52" opacity="0.6"/>
  <circle cx="340" cy="60" r="3.5" fill="#315c52" opacity="0.6"/>
  
  <!-- Axis labels -->
  <text x="30" y="80" font-family="DM Mono, monospace" font-size="9" fill="#777">
    Price
  </text>
  <text x="200" y="245" font-family="DM Mono, monospace" font-size="9" text-anchor="middle" fill="#777">
    Features
  </text>
  
  <!-- Title -->
  <text x="200" y="260" font-family="Inter, sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#171717">
    Predicted vs Actual Prices
  </text>
  <text x="200" y="280" font-family="DM Mono, monospace" font-size="11" text-anchor="middle" fill="#777">
    Regression Model · R² = 0.75
  </text>
</svg>
