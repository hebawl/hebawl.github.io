<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0ede8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8e5e0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="400" height="300" fill="url(#grad1)"/>
  
  <!-- Grid background -->
  <g stroke="#d8d7d1" stroke-width="1" opacity="0.5">
    <line x1="40" y1="0" x2="40" y2="300"/>
    <line x1="80" y1="0" x2="80" y2="300"/>
    <line x1="120" y1="0" x2="120" y2="300"/>
    <line x1="160" y1="0" x2="160" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="240" y1="0" x2="240" y2="300"/>
    <line x1="280" y1="0" x2="280" y2="300"/>
    <line x1="320" y1="0" x2="320" y2="300"/>
    <line x1="360" y1="0" x2="360" y2="300"/>
    
    <line x1="0" y1="30" x2="400" y2="30"/>
    <line x1="0" y1="60" x2="400" y2="60"/>
    <line x1="0" y1="90" x2="400" y2="90"/>
    <line x1="0" y1="120" x2="400" y2="120"/>
    <line x1="0" y1="150" x2="400" y2="150"/>
    <line x1="0" y1="180" x2="400" y2="180"/>
    <line x1="0" y1="210" x2="400" y2="210"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="0" y1="270" x2="400" y2="270"/>
  </g>
  
  <!-- Route path -->
  <polyline points="80,80 160,100 200,60 280,140 320,120 300,200" stroke="#315c52" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Delivery points -->
  <circle cx="80" cy="80" r="6" fill="#315c52"/>
  <circle cx="160" cy="100" r="6" fill="#315c52"/>
  <circle cx="200" cy="60" r="6" fill="#315c52"/>
  <circle cx="280" cy="140" r="6" fill="#315c52"/>
  <circle cx="320" cy="120" r="6" fill="#315c52"/>
  <circle cx="300" cy="200" r="6" fill="#315c52"/>
  
  <!-- Title -->
  <text x="200" y="260" font-family="Inter, sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#171717">
    City Environment & Route
  </text>
  <text x="200" y="280" font-family="DM Mono, monospace" font-size="11" text-anchor="middle" fill="#777">
    A* vs BFS Pathfinding
  </text>
</svg>
