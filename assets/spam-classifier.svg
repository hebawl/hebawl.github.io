<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0ede8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8e5e0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="400" height="300" fill="url(#grad2)"/>
  
  <!-- Confusion Matrix Grid -->
  <g>
    <!-- Background boxes -->
    <rect x="80" y="50" width="80" height="80" fill="#e8f5e9" stroke="#315c52" stroke-width="1.5"/>
    <rect x="160" y="50" width="80" height="80" fill="#fce4ec" stroke="#315c52" stroke-width="1.5"/>
    <rect x="80" y="130" width="80" height="80" fill="#fce4ec" stroke="#315c52" stroke-width="1.5"/>
    <rect x="160" y="130" width="80" height="80" fill="#e8f5e9" stroke="#315c52" stroke-width="1.5"/>
    
    <!-- True Positives -->
    <text x="120" y="100" font-family="Inter, sans-serif" font-size="28" font-weight="600" text-anchor="middle" fill="#315c52">
      943
    </text>
    <text x="120" y="115" font-family="DM Mono, monospace" font-size="9" text-anchor="middle" fill="#555">
      TP
    </text>
    
    <!-- False Positives -->
    <text x="200" y="100" font-family="Inter, sans-serif" font-size="28" font-weight="600" text-anchor="middle" fill="#c62828">
      12
    </text>
    <text x="200" y="115" font-family="DM Mono, monospace" font-size="9" text-anchor="middle" fill="#555">
      FP
    </text>
    
    <!-- False Negatives -->
    <text x="120" y="180" font-family="Inter, sans-serif" font-size="28" font-weight="600" text-anchor="middle" fill="#c62828">
      21
    </text>
    <text x="120" y="195" font-family="DM Mono, monospace" font-size="9" text-anchor="middle" fill="#555">
      FN
    </text>
    
    <!-- True Negatives -->
    <text x="200" y="180" font-family="Inter, sans-serif" font-size="28" font-weight="600" text-anchor="middle" fill="#315c52">
      568
    </text>
    <text x="200" y="195" font-family="DM Mono, monospace" font-size="9" text-anchor="middle" fill="#555">
      TN
    </text>
  </g>
  
  <!-- Labels -->
  <text x="40" y="95" font-family="DM Mono, monospace" font-size="9" fill="#777" text-anchor="end">
    Spam
  </text>
  <text x="40" y="175" font-family="DM Mono, monospace" font-size="9" fill="#777" text-anchor="end">
    Ham
  </text>
  
  <text x="120" y="35" font-family="DM Mono, monospace" font-size="9" text-anchor="middle" fill="#777">
    Predicted Spam
  </text>
  <text x="200" y="35" font-family="DM Mono, monospace" font-size="9" text-anchor="middle" fill="#777">
    Predicted Ham
  </text>
  
  <!-- Title -->
  <text x="200" y="260" font-family="Inter, sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#171717">
    Confusion Matrix - SVM Model
  </text>
  <text x="200" y="280" font-family="DM Mono, monospace" font-size="11" text-anchor="middle" fill="#777">
    98% Accuracy · TF-IDF Vectorizer
  </text>
</svg>
